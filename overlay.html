<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JC StreamTools | Kombiniertes Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:white;background:transparent}body.preview{background:radial-gradient(circle at 75% 15%,#302052,#090b19 65%)}.stage{position:relative;width:100%;height:100%;overflow:hidden}.chat{position:absolute;left:3%;bottom:5%;width:min(36%,560px);display:flex;flex-direction:column;gap:9px;pointer-events:none}.message{padding:12px 16px;border:1px solid #a65bff66;border-left:3px solid #b86bff;background:#130d27e8;box-shadow:0 7px 30px #0007,0 0 18px #9c48ef33;border-radius:13px;overflow-wrap:anywhere;animation:in .4s ease both}.message b{display:block;color:#d5a4ff;margin-bottom:4px;font-size:14px}.message span{font-size:16px;line-height:1.4}.alerts{position:absolute;right:4%;top:7%;width:min(39%,570px);pointer-events:none}.alert{--glow:#bd64ff;position:relative;padding:24px 30px;text-align:center;border:1px solid var(--glow);border-radius:23px;background:linear-gradient(145deg,#211039ed,#090a20f5);box-shadow:0 0 35px color-mix(in srgb,var(--glow) 45%,transparent);animation:in .55s cubic-bezier(.18,1.3,.32,1) both}.alert.sub{--glow:#ff61b9}.alert.bits{--glow:#45e4ff}.alert .symbol{font-size:46px;color:var(--glow);text-shadow:0 0 20px var(--glow)}.alert .heading{color:var(--glow);font-size:14px;letter-spacing:3px;font-weight:800;margin:8px 0}.alert .name{font-size:clamp(22px,3vw,38px);font-weight:900;overflow-wrap:anywhere}.alert .detail{font-size:15px;color:#e1d7ed;margin-top:9px}.fade{animation:out .45s ease forwards!important}@keyframes in{from{opacity:0;transform:translateY(25px) scale(.92);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes out{to{opacity:0;transform:translateY(-18px);filter:blur(5px)}}.toolbar{position:absolute;top:12px;left:12px;z-index:10;display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#110e25dd;border:1px solid #7653a1;border-radius:13px}.toolbar button{border:1px solid #8c5fbe;background:#24133d;color:white;border-radius:8px;padding:9px 12px;cursor:pointer}.toolbar button:hover{background:#492266}.hint{position:absolute;left:14px;top:75px;color:#a99abb;font-size:12px}body:not(.preview) .toolbar,body:not(.preview) .hint{display:none}@media(max-width:650px){.chat{width:57%}.alerts{width:50%}.message{padding:7px 9px}.message span{font-size:12px}.alert{padding:13px}.alert .symbol{font-size:27px}.alert .heading{font-size:10px}}
</style></head><body><div class="stage"><div class="toolbar"><button id="chatTest">Chat testen</button><button data-alert="follow">Follower</button><button data-alert="sub">Sub</button><button data-alert="bits">Bits</button></div><div class="hint">Vorschau – für OBS ?obs=1 verwenden</div><div id="chat" class="chat" aria-live="polite"></div><div id="alerts" class="alerts" aria-live="polite"></div></div><script>
'use strict';
const params=new URLSearchParams(location.search);const obs=params.get('obs')==='1';if(!obs)document.body.classList.add('preview');
const chat=document.getElementById('chat'),alerts=document.getElementById('alerts');const defaults={chatEnabled:true,alertsEnabled:true,chatX:3,chatY:5,alertX:4,alertY:7,chatLife:15,alertDuration:6};let config={...defaults};let alertQueue=[],alertBusy=false;const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));
function applyConfig(next){if(!next||typeof next!=='object')return;config={...config,...next};chat.style.display=config.chatEnabled===false?'none':'flex';alerts.style.display=config.alertsEnabled===false?'none':'block';chat.style.left=clamp(config.chatX,0,75)+'%';chat.style.bottom=clamp(config.chatY,0,80)+'%';alerts.style.right=clamp(config.alertX,0,75)+'%';alerts.style.top=clamp(config.alertY,0,80)+'%'}
try{const saved=JSON.parse(localStorage.getItem('jc_overlay_settings')||'null');applyConfig(saved)}catch{}
function addChat(user,message){if(config.chatEnabled===false)return;const el=document.createElement('div');el.className='message';const b=document.createElement('b'),s=document.createElement('span');b.textContent=String(user||'Gast').slice(0,50);s.textContent=String(message||'').slice(0,500);el.append(b,s);chat.append(el);while(chat.children.length>7)chat.firstChild.remove();setTimeout(()=>{el.classList.add('fade');setTimeout(()=>el.remove(),450)},clamp(config.chatLife,3,120)*1000)}
const kinds={follow:['♡','NEUER FOLLOWER','folgt jetzt deinem Kanal!'],sub:['★','NEUES ABONNEMENT','hat deinen Kanal abonniert!'],bits:['◆','BITS CHEER','unterstützt deinen Stream mit Bits!']};
function showAlert(kind,user,duration){if(!kinds[kind]||config.alertsEnabled===false)return;alertQueue.push({kind,user:String(user||'Unbekannt').slice(0,70),duration:clamp(duration||config.alertDuration,2,30)});processQueue()}
function processQueue(){if(alertBusy||!alertQueue.length)return;alertBusy=true;const a=alertQueue.shift(),k=kinds[a.kind],el=document.createElement('div');el.className='alert '+a.kind;for(const [cls,val] of [['symbol',k[0]],['heading',k[1]],['name',a.user],['detail',k[2]]]){const d=document.createElement('div');d.className=cls;d.textContent=val;el.append(d)}alerts.replaceChildren(el);setTimeout(()=>{el.classList.add('fade');setTimeout(()=>{el.remove();alertBusy=false;processQueue()},450)},a.duration*1000)}
function receive(data){if(!data||typeof data!=='object')return;if(data.type==='chat')addChat(data.user,data.message);if(data.type==='alert')showAlert(data.event||data.kind,data.user,data.duration);if(data.type==='overlay-config')applyConfig(data.settings)}
window.addEventListener('message',e=>{if(e.origin!==location.origin&&e.origin!=='null')return;receive(e.data)});
try{const bc=new BroadcastChannel('jc_streamtools_neon');bc.onmessage=e=>receive(e.data)}catch{}
if(!obs){document.getElementById('chatTest').onclick=()=>addChat('FaulieFan','Moin Faulie! Dein Stream sieht mega aus 💜');document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>showAlert(b.dataset.alert,'NeonSloth',5))}
</script></body></html>
